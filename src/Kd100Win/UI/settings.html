<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kd100-win settings</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --panel2: #f0f1f4; --line: #dfe1e6; --text: #1d1f24; --dim: #6b7080;
  --accent: #2a8fd0; --accent-soft: #e2f1fb; --danger: #d64545; --danger-soft: #fdeaea; --ok: #2f9e5b;
  --key: #ffffff; --key-edge: #c9ccd4; --key-text: #1d1f24; --device: #2b2e35; --device-edge: #1b1d22;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #18191d; --panel: #212329; --panel2: #2a2d34; --line: #353841; --text: #e8e9ec; --dim: #9196a3;
    --accent: #4cb3f0; --accent-soft: #1f3a4d; --danger: #ef6b6b; --danger-soft: #45282b; --ok: #4fc27f;
    --key: #3a3e47; --key-edge: #4a4f5a; --key-text: #eef0f3; --device: #121317; --device-edge: #000;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.4 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; overflow: hidden; user-select: none; }
input, select, textarea, button { font: inherit; color: inherit; }
button { cursor: pointer; }
.app { display: grid; grid-template-columns: 250px 1fr; grid-template-rows: 1fr auto; height: 100vh; }

/* sidebar */
aside { grid-row: 1 / 3; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 16px 12px; font-weight: 600; font-size: 16px; }
.brand svg { width: 26px; height: 26px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); margin-left: auto; transition: background .2s; }
.status-dot.live { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
.side-title { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 6px; color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.icon-btn { border: 0; background: transparent; width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; color: var(--dim); font-size: 18px; line-height: 1; }
.icon-btn:hover { background: var(--panel2); color: var(--text); }
.nav { list-style: none; margin: 0; padding: 0 8px; }
.nav li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.nav li:hover { background: var(--panel2); }
.nav li.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav .ico { width: 20px; height: 20px; flex: none; display: grid; place-items: center; }
.nav .ico img { width: 20px; height: 20px; }
.nav .sub { color: var(--dim); font-size: 12px; margin-left: auto; font-weight: 400; }
.side-bottom { margin-top: auto; padding: 8px 8px 14px; }

/* main */
main { overflow-y: auto; padding: 22px 26px 30px; }
h1 { font-size: 22px; font-weight: 600; margin: 0; }
.head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.head input.title { font-size: 22px; font-weight: 600; border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 2px 8px; margin-left: -9px; min-width: 120px; }
.head input.title:hover { border-color: var(--line); }
.head input.title:focus { border-color: var(--accent); outline: none; background: var(--panel); }
.spacer { flex: 1; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 16px 18px; margin-bottom: 16px; }
.card h2 { font-size: 15px; margin: 0 0 4px; font-weight: 600; }
.hint { color: var(--dim); font-size: 12.5px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; }
.btn:hover { background: var(--panel2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.primary:disabled { opacity: .5; cursor: default; filter: none; }
.btn.danger { color: var(--danger); }
.btn.small { padding: 3px 9px; font-size: 12.5px; }
.btn.mod { min-width: 46px; }
.btn.mod.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.link { border: 0; background: none; color: var(--accent); padding: 0; }
.link:hover { text-decoration: underline; }
input[type=text], input[type=number], select, textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; min-width: 0; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
input.invalid, select.invalid { border-color: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }
input.mono { font-family: "Cascadia Mono", Consolas, monospace; font-size: 13px; }
textarea { width: 100%; resize: vertical; min-height: 54px; }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 6px 3px 8px; font-size: 13px; }
.chip img { width: 16px; height: 16px; }
.chip button { border: 0; background: transparent; color: var(--dim); padding: 0 2px; font-size: 15px; line-height: 1; }
.chip button:hover { color: var(--danger); }

/* tabs */
.tabs { display: inline-flex; background: var(--panel2); border-radius: 9px; padding: 3px; gap: 2px; }
.tabs button { border: 0; background: transparent; padding: 5px 14px; border-radius: 7px; color: var(--dim); }
.tabs button.on { background: var(--panel); color: var(--text); box-shadow: var(--shadow); font-weight: 600; }

/* profile layout */
.workspace { display: grid; grid-template-columns: minmax(330px, 400px) 1fr; gap: 16px; align-items: start; }

/* device */
.device { background: var(--device); border: 2px solid var(--device-edge); border-radius: 26px; padding: 22px 20px 20px; box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.06); }
.dial-wrap { display: grid; place-items: center; margin-bottom: 34px; }
.dial { position: relative; width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #50545e, #2b2e35 70%); border: 3px solid #5e636e; display: grid; place-items: center; cursor: pointer; transition: transform .15s; }
.dial:hover { border-color: var(--accent); }
.dial.sel { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 30%, transparent); }
.dial.spin-cw { transform: rotate(12deg); }
.dial.spin-ccw { transform: rotate(-12deg); }
.dial .ticks { position: absolute; inset: 6px; border-radius: 50%; background: repeating-conic-gradient(rgba(255,255,255,.18) 0 2deg, transparent 2deg 15deg); -webkit-mask: radial-gradient(circle, transparent 60%, #000 61%); mask: radial-gradient(circle, transparent 60%, #000 61%); }
.dial .dlabel { position: absolute; bottom: -24px; font-size: 12px; color: #aab0bd; white-space: nowrap; }
.keys { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(5, 62px); gap: 8px; }
.key { position: relative; background: var(--key); border: 1px solid var(--key-edge); border-bottom-width: 3px; border-radius: 9px; color: var(--key-text); padding: 5px 6px 4px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; overflow: hidden; transition: transform .06s, border-color .12s, box-shadow .12s; }
.key.center { width: 62px; height: 62px; border-radius: 50%; padding: 4px; z-index: 1; }
.key:hover { border-color: var(--accent); }
.key.sel { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 40%, transparent); }
.key.pressed { transform: translateY(2px); border-bottom-width: 1px; background: var(--accent-soft); }
.key.inherited .klabel { opacity: .5; font-style: italic; }
.key.dragging { opacity: .35; }
.key.drop-target { border-color: var(--accent); border-style: dashed; background: var(--accent-soft); }
.key .num { position: absolute; top: 3px; left: 6px; font-size: 10px; color: var(--dim); }
.key .klabel { font-size: 11.5px; line-height: 1.15; max-width: 100%; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; }
.key img { width: 22px; height: 22px; margin-bottom: 2px; }
.key .badges { position: absolute; top: 3px; right: 5px; display: flex; gap: 2px; }
.badge { font-size: 9px; font-weight: 700; padding: 0 3px; border-radius: 4px; background: var(--accent); color: #fff; line-height: 13px; }
.badge.menu { background: #9a6be0; }
.badge.hold { background: #d98a2b; }
.k15 { grid-column: 4; grid-row: 4 / 6; }
.k16 { grid-column: 1 / 3; grid-row: 5; }
.k17 { grid-column: 3; grid-row: 5; }
.legend { display: flex; gap: 10px; margin-top: 12px; justify-content: center; font-size: 11.5px; color: #aab0bd; flex-wrap: wrap; }

/* editor */
.editor-title { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
.gesture { border-top: 1px solid var(--line); padding: 12px 0 10px; }
.gesture:first-of-type { border-top: 0; }
.gesture-head { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.gesture-head .gname { font-weight: 600; }
.gesture-head .ghint { color: var(--dim); font-size: 12px; }
.gesture-head .x { margin-left: auto; }
.inherit-box { background: var(--panel2); border-radius: 9px; padding: 10px 12px; margin: 10px 0 4px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.add-gestures { display: flex; gap: 6px; flex-wrap: wrap; padding-top: 10px; border-top: 1px solid var(--line); }

/* action field */
.action { display: grid; gap: 6px; }
.action .line { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.action .line > input[type=text] { flex: 1; min-width: 140px; }
.action select.type { min-width: 170px; }
.action .err { color: var(--danger); font-size: 12px; }
.ico20 { width: 22px; height: 22px; flex: none; display: grid; place-items: center; }
.ico20 img { width: 20px; height: 20px; }
.recorder { min-width: 170px; flex: 1; border: 1px dashed var(--key-edge); border-radius: 8px; padding: 4px 6px; display: flex; gap: 4px; align-items: center; flex-wrap: wrap; min-height: 32px; cursor: pointer; background: var(--panel); }
.recorder:hover { border-color: var(--accent); }
.recorder.rec { border-style: solid; border-color: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }
.recorder .placeholder { color: var(--dim); font-size: 13px; }
kbd { display: inline-block; background: var(--panel2); border: 1px solid var(--key-edge); border-bottom-width: 2px; border-radius: 5px; padding: 0 6px; font: 12.5px "Segoe UI", sans-serif; line-height: 20px; }
.plus { color: var(--dim); font-size: 12px; }
.seq-gap { width: 10px; }

/* dial modes */
.modes { display: grid; gap: 10px; margin-top: 10px; }
.mode { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--panel); }
.mode.current { border-color: var(--accent); }
.mode-head { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.mode-head input.name { font-weight: 600; flex: 1; max-width: 240px; }
.mode-grid { display: grid; grid-template-columns: 1fr; gap: 4px; }
.mode-grid .lbl { padding-top: 4px; }
.mode-grid .lbl { color: var(--dim); font-size: 12.5px; padding-top: 6px; }
.nums { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.nums label { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12.5px; }
.nums input { width: 70px; }

/* menus */
.menu-layout { display: grid; grid-template-columns: 1fr 340px; gap: 16px; align-items: start; }
.item { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 8px; background: var(--panel); }
.item.sel { border-color: var(--accent); }
.item .iconbox { width: 34px; height: 34px; border-radius: 8px; background: var(--panel2); display: grid; place-items: center; overflow: hidden; font-weight: 700; color: var(--dim); }
.item .iconbox img { width: 26px; height: 26px; }
.item .tools { display: flex; flex-direction: column; gap: 2px; }
.preview { position: sticky; top: 0; }
.preview svg { width: 100%; height: auto; display: block; }

/* general */
.setting { display: flex; align-items: center; gap: 16px; padding: 12px 0; border-top: 1px solid var(--line); }
.setting:first-of-type { border-top: 0; }
.setting .txt { flex: 1; }
.setting .txt b { display: block; font-weight: 600; }
.switch { position: relative; width: 40px; height: 22px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; background: var(--key-edge); border-radius: 999px; transition: .15s; cursor: pointer; }
.switch span::after { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { left: 21px; }
input[type=range] { width: 200px; accent-color: var(--accent); }
.path { font-family: "Cascadia Mono", Consolas, monospace; font-size: 12px; color: var(--dim); user-select: text; word-break: break-all; }

/* save bar */
.savebar { grid-column: 2; display: flex; align-items: center; gap: 10px; padding: 10px 26px; background: var(--panel); border-top: 1px solid var(--line); }
.savebar .state { color: var(--dim); }
.savebar .state.dirty { color: var(--text); font-weight: 600; }
.errors { grid-column: 2; background: var(--danger-soft); color: var(--danger); padding: 10px 26px; white-space: pre-wrap; font-size: 13px; border-top: 1px solid var(--danger); user-select: text; max-height: 160px; overflow-y: auto; }
.banner { background: var(--accent-soft); border: 1px solid var(--accent); color: var(--text); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; display: flex; gap: 10px; align-items: center; }

/* popover */
.popover { position: fixed; z-index: 50; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.25); padding: 10px; width: 340px; height: 430px; display: flex; flex-direction: column; gap: 8px; }
.popover .list { overflow-y: auto; display: flex; flex-direction: column; flex: 1; }
.popover .opt { display: flex; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 7px; cursor: pointer; }
.popover .opt:hover { background: var(--panel2); }
.popover .opt img, .popover .opt .noimg { width: 20px; height: 20px; flex: none; }
.popover .opt .t { overflow: hidden; }
.popover .opt .t div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.popover .opt .t .s { color: var(--dim); font-size: 12px; }
.toast { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 60; }
.toast.show { opacity: .95; }
.empty { color: var(--dim); text-align: center; padding: 26px; }
</style>
</head>

<div class="app">
  <aside>
    <div class="brand">
      <svg viewBox="0 0 256 256"><rect x="40" y="8" width="176" height="240" rx="36" fill="#20242c" stroke="#5ac8fa" stroke-width="10"/><circle cx="128" cy="76" r="45" fill="#3c424e" stroke="#5ac8fa" stroke-width="10"/><circle cx="128" cy="76" r="14" fill="#5ac8fa"/><g fill="#c8cdd7"><rect x="72" y="146" width="30" height="22" rx="5"/><rect x="114" y="146" width="30" height="22" rx="5"/><rect x="156" y="146" width="30" height="22" rx="5"/><rect x="72" y="178" width="30" height="22" rx="5"/><rect x="114" y="178" width="30" height="22" rx="5"/><rect x="156" y="178" width="30" height="22" rx="5"/><rect x="72" y="210" width="30" height="22" rx="5"/><rect x="114" y="210" width="30" height="22" rx="5"/><rect x="156" y="210" width="30" height="22" rx="5"/></g></svg>
      kd100-win
      <span class="status-dot" id="live" title=""></span>
    </div>
    <div class="side-title"><span data-t="profiles"></span><button class="icon-btn" id="add-profile" title="">+</button></div>
    <ul class="nav" id="nav-profiles"></ul>
    <div class="side-title"><span data-t="menus"></span><button class="icon-btn" id="add-menu" title="">+</button></div>
    <ul class="nav" id="nav-menus"></ul>
    <div class="side-bottom">
      <ul class="nav"><li id="nav-general"><span class="ico">⚙</span><span data-t="general"></span></li></ul>
    </div>
  </aside>
  <main id="main"></main>
  <div class="savebar">
    <span class="state" id="save-state"></span>
    <span class="spacer"></span>
    <button class="btn" id="revert" data-t="revert"></button>
    <button class="btn primary" id="save" data-t="save"></button>
  </div>
</div>
<div class="toast" id="toast"></div>

const MEDIA = ["media_play_pause", "media_next", "media_prev", "media_stop", "volume_up", "volume_down", "volume_mute"];
const MEDIA_ALIASES = { play_pause: "media_play_pause", mute: "volume_mute" };
const MODS = ["ctrl", "control", "shift", "alt", "win", "lctrl", "rctrl", "lshift", "rshift", "lalt", "ralt"];

function parseAction(s) {
  s = (s ?? "").trim();
  if (!s || s.toLowerCase() === "none") return { type: "none" };
  const i = s.indexOf(":");
  const pre = i > 0 ? s.slice(0, i).toLowerCase() : "";
  const arg = i > 0 ? s.slice(i + 1).trim() : "";
  if (pre === "run" || pre.startsWith("run@")) {
    const r = parseRun(arg);
    const opts = pre.slice(4).split(",").map(o => o.trim()).filter(Boolean);
    r.screen = opts.find(o => /^\d+$/.test(o)) ?? "";
    r.max = opts.includes("max");
    return r;
  }
  switch (pre) {
    case "keys": return { type: "seq", value: arg };
    case "text": return { type: "text", value: s.slice(i + 1) };
    case "wheel": { const [dir, amt] = arg.split(":"); return { type: "wheel", dir: (dir || "down").toLowerCase(), amount: +amt || 120 }; }
    case "mouse": return { type: "mouse", value: arg.toLowerCase() };
    case "dial": return { type: "dial", value: arg };
    case "layer": return { type: "layer", value: "toggle" };
  }
  if (s.toLowerCase() === "layer") return { type: "layer", value: "hold" };
  const lower = s.toLowerCase();
  if (MEDIA.includes(lower) || MEDIA_ALIASES[lower]) return { type: "media", value: MEDIA_ALIASES[lower] ?? lower };
  if (/^[^\s:]+$/.test(s)) return { type: "shortcut", value: lower };
  return { type: "custom", value: s };
}

function parseRun(arg) {
  let file = arg, rest = "";
  if (arg.startsWith('"')) {
    const end = arg.indexOf('"', 1);
    file = end > 0 ? arg.slice(1, end) : arg.slice(1);
    rest = end > 0 ? arg.slice(end + 1).trim() : "";
  } else {
    const sp = arg.indexOf(" ");
    if (sp > 0) { file = arg.slice(0, sp); rest = arg.slice(sp + 1).trim(); }
  }
  if (/^https?:\/\//i.test(file)) return { type: "url", url: file, browser: "" };
  if (rest && /^https?:\/\/\S+$/i.test(rest)) return { type: "url", url: rest, browser: file };
  return { type: "run", target: file, args: rest };
}

const runPrefix = a => (a.screen || a.max) ? `run@${[a.screen, a.max && "max"].filter(Boolean).join(",")}:` : "run:";
const quotePath = v => /\s/.test(v) && !v.startsWith('"') ? `"${v}"` : v;

function buildAction(a) {
  switch (a.type) {
    case "none": return "none";
    case "shortcut": return a.value || "none";
    case "seq": return "keys:" + (a.value ?? "");
    case "text": return "text:" + (a.value ?? "");
    case "run":
      if (!a.target) return runPrefix(a);
      return runPrefix(a) + quotePath(a.target) + (a.args ? " " + a.args : "");
    case "url":
      if (!a.url) return runPrefix(a);
      return a.browser ? `${runPrefix(a)}${quotePath(a.browser)} ${a.url}` : runPrefix(a) + a.url;
    case "media": return a.value || "media_play_pause";
    case "wheel": return `wheel:${a.dir || "down"}` + (a.amount && +a.amount !== 120 ? `:${a.amount}` : "");
    case "mouse": return "mouse:" + (a.value || "left");
    case "dial": return "dial:" + (a.value || "next");
    case "layer": return a.value === "toggle" ? "layer:toggle" : "layer";
    default: return a.value ?? "";
  }
}

const KEY_LABELS = { ctrl: "Ctrl", control: "Ctrl", shift: "Shift", alt: "Alt", win: "Win", esc: "Esc", escape: "Esc", enter: "Enter", space: "Space",
  backspace: "Backspace", delete: "Del", del: "Del", insert: "Ins", pageup: "PgUp", pagedown: "PgDn", pgup: "PgUp", pgdn: "PgDn",
  left: "←", right: "→", up: "↑", down: "↓", minus: "-", equals: "=", plus: "=", comma: ",", period: ".", slash: "/", backslash: "\\", backtick: "`", tab: "Tab", home: "Home", end: "End" };
const keyLabel = k => KEY_LABELS[k] ?? (k.length === 1 ? k.toUpperCase() : k.length <= 3 && /^f\d+$/.test(k) ? k.toUpperCase() : k.charAt(0).toUpperCase() + k.slice(1));
const prettyChord = c => c.split("+").map(k => keyLabel(k.trim().toLowerCase())).join("+");

function summary(action) {
  const a = parseAction(action);
  const text = baseSummary(a);
  return (a.type === "run" || a.type === "url") && a.screen ? `${text} → 🖥${a.screen}` : text;
}

function baseSummary(a) {
  switch (a.type) {
    case "none": return "—";
    case "shortcut": return prettyChord(a.value);
    case "seq": return a.value.split(/\s+/).filter(Boolean).map(prettyChord).join(", ");
    case "text": return `“${a.value}”`;
    case "url":

    case "run": {

    case "wheel": return `${t("t_wheel")} ${({ up: "↑", down: "↓", left: "←", right: "→" })[a.dir] ?? a.dir}`;
    case "mouse": return `🖱 ${t("mb_" + a.value)}`;

// ----- key recorder -----
const CODE_MAP = { Space: "space", Enter: "enter", NumpadEnter: "enter", Escape: "esc", Backspace: "backspace", Tab: "tab", Delete: "delete", Insert: "insert",
  Home: "home", End: "end", PageUp: "pageup", PageDown: "pagedown", ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down",
  Minus: "minus", Equal: "equals", BracketLeft: "[", BracketRight: "]", Semicolon: ";", Quote: "'", Comma: "comma", Period: "period", Slash: "slash",
  Backslash: "backslash", IntlBackslash: "backslash", Backquote: "backtick", CapsLock: "capslock", PrintScreen: "printscreen", Pause: "pause", ContextMenu: "menu",
  NumpadMultiply: "multiply", NumpadAdd: "add", NumpadSubtract: "subtract", NumpadDecimal: "decimal", NumpadDivide: "divide", NumLock: "numlock", ScrollLock: "scrolllock",
  AudioVolumeUp: "volume_up", AudioVolumeDown: "volume_down", AudioVolumeMute: "volume_mute", MediaTrackNext: "media_next", MediaTrackPrevious: "media_prev",
  MediaStop: "media_stop", MediaPlayPause: "media_play_pause" };
function codeToKey(code) {
  if (CODE_MAP[code]) return CODE_MAP[code];
  let m;
  if ((m = /^Key([A-Z])$/.exec(code))) return m[1].toLowerCase();
  if ((m = /^Digit(\d)$/.exec(code))) return m[1];
  if ((m = /^Numpad(\d)$/.exec(code))) return "num" + m[1];
  if ((m = /^F(\d{1,2})$/.exec(code))) return "f" + m[1];
  return null;
}
const MOD_CODES = { ControlLeft: "ctrl", ControlRight: "ctrl", ShiftLeft: "shift", ShiftRight: "shift", AltLeft: "alt", AltRight: "alt", MetaLeft: "win", MetaRight: "win" };

let activeRecorder = null;
function recorder(value, sequence, onDone) {
  const el = h("div", { class: "recorder", tabindex: 0 });
  let rec = false, mods = new Set(), chords = [], sawKey = false;
  const draw = (v, live) => {
    el.replaceChildren();
    const parts = (v ?? "").split(/\s+/).filter(Boolean);
    if (!parts.length && !live) { el.append(h("span", { class: "placeholder" }, rec ? t("recording") : "⌨ " + t("record"))); return; }
    parts.forEach((c, i) => {
      if (i) el.append(h("span", { class: "seq-gap" }));
      c.split("+").forEach((k, j) => { if (j) el.append(h("span", { class: "plus" }, "+")); el.append(h("kbd", {}, keyLabel(k))); });
    });
    if (live) { if (parts.length) el.append(h("span", { class: "seq-gap" })); [...mods].forEach((k, j) => { if (j) el.append(h("span", { class: "plus" }, "+")); el.append(h("kbd", {}, keyLabel(k))); }); }
    if (rec && !live) el.append(h("span", { class: "placeholder" }, " …"));
  };
  const order = ["ctrl", "shift", "alt", "win"];
  const chordOf = (key) => [...order.filter(m => mods.has(m)), key].filter(Boolean).join("+");
  function start() {
    if (activeRecorder && activeRecorder !== stop) activeRecorder();
    rec = true; mods.clear(); chords = sequence ? (value ?? "").split(/\s+/).filter(Boolean) : []; sawKey = false;
    el.classList.add("rec"); el.focus(); draw(sequence ? chords.join(" ") : "", false);
    activeRecorder = stop;
  }
  function stop() {
    if (!rec) return;
    rec = false; el.classList.remove("rec"); activeRecorder = null;
    draw(value, false);
  }
  function commit(chord) {
    if (sequence) { chords.push(chord); value = chords.join(" "); onDone(value); draw(value, false); }
    else { value = chord; onDone(value); stop(); }
  }
  el.addEventListener("click", () => rec ? null : start());
  el.addEventListener("blur", stop);
  el.addEventListener("keydown", e => {
    if (!rec) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); start(); } return; }
    e.preventDefault(); e.stopPropagation();
    if (MOD_CODES[e.code]) { mods.add(MOD_CODES[e.code]); draw(sequence ? chords.join(" ") : "", true); return; }
    const key = codeToKey(e.code);
    if (!key) return;
    if (e.ctrlKey) mods.add("ctrl"); if (e.shiftKey) mods.add("shift"); if (e.altKey) mods.add("alt");
    sawKey = true;
    commit(chordOf(key));
    mods.clear();
  });
  el.addEventListener("keyup", e => {
    if (!rec) return;
    e.preventDefault();
    if (MOD_CODES[e.code]) {
      // Releasing modifiers without another key records the modifier itself (e.g. "ctrl" to hold).
      if (!sawKey && mods.size) { const c = chordOf(null); mods.clear(); commit(c); }
      else mods.delete(MOD_CODES[e.code]);
      sawKey = false;
    }
  });
  draw(value, false);
  return { el, update: v => { value = v; if (!rec) draw(v, false); } };
}

// ----- dial modes -----

let popover = null;

 * A popover with a search box over sections of {name, sub, icon | iconTarget, ...}.

function listPopover(anchor, { title, placeholder, load, onPick, allowText }) {
  closePopover();
  const list = h("div", { class: "list" }, h("div", { class: "hint", style: "padding:6px" }, "…"));
  let sections = [];
  const typed = () => input.value.trim().replace(/\.exe$/i, "");
  const pickText = () => { if (allowText && typed()) { onPick({ name: typed(), value: typed() }); closePopover(); } };
  const input = h("input", { type: "text", placeholder, oninput: draw, onkeydown: e => {
    if (e.key === "Escape") closePopover();

    const opts = list.querySelectorAll(".opt");
    if (opts.length === 1 || (opts.length && !allowText)) opts[0].click(); else pickText();
  } });
  const observer = new IntersectionObserver(entries => {
    for (const en of entries) {
      if (!en.isIntersecting) continue;
      const img = en.target;
      observer.unobserve(img);
      iconFor(img.dataset.target).then(url => { if (url) { img.src = url; img.style.visibility = "visible"; } });
    }
  }, { root: list });
  function draw() {
    const q = input.value.trim().toLowerCase();
    const kids = [];
    for (const sec of sections) {
      const items = sec.items.filter(it => !q || it.name.toLowerCase().includes(q) || (it.sub ?? "").toLowerCase().includes(q));
      if (!items.length) continue;
      if (sec.title) kids.push(h("div", { class: "hint", style: "padding:8px 8px 2px;font-weight:600" }, sec.title));
      for (const it of items.slice(0, 300)) {
        let img;
        if (it.icon) img = h("img", { src: it.icon });
        else if (it.iconTarget) { img = h("img", { "data-target": it.iconTarget, style: "visibility:hidden" }); observer.observe(img); }
        else img = h("span", { class: "noimg" });
        kids.push(h("div", { class: "opt", onclick: () => { onPick(it); closePopover(); } }, img,
          h("div", { class: "t" }, h("div", {}, it.name), it.sub ? h("div", { class: "s" }, it.sub) : null)));
      }
    }
    if (!kids.length) kids.push(h("div", { class: "hint", style: "padding:8px" }, allowText && q ? t("enterToAdd", input.value.trim()) : t("nothingFound")));
    list.replaceChildren(...kids);

    allowText ? h("div", { class: "row" }, h("span", { class: "spacer" }), h("button", { class: "btn small", onclick: pickText }, t("add"))) : null);
  document.body.append(popover);

  popover.style.top = Math.max(8, Math.min(r.bottom + 6, innerHeight - 440)) + "px";

}

/** Lets the user pick an icon; images Windows cannot read itself (WebP, SVG, AVIF) are converted to PNG. */
async function pickIcon() {
  const path = await call("browse", { kind: "icon" });
  if (!path || /\.(png|jpe?g|bmp|ico|exe|dll)$/i.test(path)) return path;
  try {
    const src = await call("readImage", { path });
    const img = new Image();
    await new Promise((ok, fail) => { img.onload = ok; img.onerror = () => fail(new Error("decode")); img.src = src; });
    const size = 128, canvas = document.createElement("canvas");
    canvas.width = canvas.height = size;
    const k = Math.min(size / (img.naturalWidth || size), size / (img.naturalHeight || size));
    const w = (img.naturalWidth || size) * k, hgt = (img.naturalHeight || size) * k;
    canvas.getContext("2d").drawImage(img, (size - w) / 2, (size - hgt) / 2, w, hgt);
    return await call("saveIcon", { name: path.split(/[\\/]/).pop(), data: canvas.toDataURL("image/png") });
  } catch {
    toast(t("iconFailed"));
    return null;
  }
}

function radialPreview(items, sel) {

    const a0 = -90 - sweep / 2 + i * sweep + gap / 2, a1 = a0 + sweep - gap;
    const [x0, y0] = pt(R, a0), [x1, y1] = pt(R, a1), [x2, y2] = pt(r + 4, a1), [x3, y3] = pt(r + 4, a0);

    path.setAttribute("d", `M${x0},${y0} A${R},${R} 0 ${large} 1 ${x1},${y1} L${x2},${y2} A${r + 4},${r + 4} 0 ${large} 0 ${x3},${y3} Z`);
    path.setAttribute("fill", i === sel ? "rgba(52,150,205,.92)" : "rgba(30,32,38,.86)");

    svg.append(path);

      img.setAttribute("x", tx - 11); img.setAttribute("y", ty - 20); img.setAttribute("width", 22); img.setAttribute("height", 22);
      iconFor(tg, !!it.icon).then(url => url && img.setAttribute("href", url));

    txt.setAttribute("x", tx); txt.setAttribute("y", tg && host ? ty + 14 : ty + 4);
    txt.setAttribute("text-anchor", "middle"); txt.setAttribute("fill", "#fff"); txt.setAttribute("font-size", "11");
    const label = it.label || "";

function updateSaveBar() {
  const dirty = isDirty();
  const st = $("#save-state");
  st.textContent = dirty ? "● " + t("unsaved") : t("saved");
  st.className = "state" + (dirty ? " dirty" : "");
  $("#save").disabled = !dirty;
  $("#revert").disabled = !dirty;
  host?.postMessage({ id: 0, method: "dirty", args: { dirty } });
}

let errorsEl = null;
function showErrors(text) {
  errorsEl?.remove(); errorsEl = null;
  if (!text) return;
  errorsEl = h("div", { class: "errors" }, text);
  $(".app").insertBefore(errorsEl, $(".savebar"));
}

async function save() {
  if (!isDirty()) return true;
  const r = await call("save", { config });
  if (!r.ok) { showErrors(r.error); return false; }
  showErrors(null);
  saved = JSON.stringify(config);
  info.changedOnDisk = false; info.error = null;
  updateSaveBar(); toast(t("savedToast"));
  return true;
}

async function reload() {
  info = await call("init");
  browsers = await call("browsers").catch(() => []);
  screens = await call("screens").catch(() => []);
  config = info.config ?? {};
  config.profiles ??= [];
  config.menus ??= {};
  saved = JSON.stringify(config);
  applyLanguage();
  showErrors(null);
  render();
}

function applyLanguage() {
  const l = config?.language && config.language !== "auto" ? config.language : info.systemLanguage;
  lang = I18N[l] ? l : "en";
  document.documentElement.lang = lang;
}

function toast(text) {
  const el = $("#toast");
  el.textContent = text; el.classList.add("show");
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 1800);
}

// ---------- host events ----------
function onHostEvent(m) {
  if (m.event === "buttons") {
    const newly = m.mask & ~pressedMask;
    pressedMask = m.mask;
    pulseLive();
    if (newly && view.kind === "profile") {
      const b = Math.log2(newly & -newly);
      if (selButton !== b) { selButton = b; render(); return; }
    }
    document.querySelectorAll(".key[data-b]").forEach(k => k.classList.toggle("pressed", !!((pressedMask >> +k.dataset.b) & 1)));
  } else if (m.event === "dial") {
    pulseLive();
    if (view.kind === "profile" && selButton !== "dial") { selButton = "dial"; render(); }
    const d = $("#dial");
    if (d) { d.classList.remove("spin-cw", "spin-ccw"); void d.offsetWidth; d.classList.add(m.direction > 0 ? "spin-cw" : "spin-ccw"); clearTimeout(d._t); d._t = setTimeout(() => d.classList.remove("spin-cw", "spin-ccw"), 180); }
  } else if (m.event === "configChanged") {
    call("init").then(fresh => {
      if (JSON.stringify(fresh.config) === saved) return;
      if (!isDirty()) reload(); else { info.changedOnDisk = true; render(); }
    });
  } else if (m.event === "saveAndClose") {
    save().then(ok => ok && call("close"));
  }
}
function pulseLive() {
  const el = $("#live");
  el.classList.add("live"); el.title = t("live");
  clearTimeout(liveTimer); liveTimer = setTimeout(() => { el.classList.remove("live"); el.title = t("idle"); }, 4000);
}

          dial: [{ name: "Volume", cw: "volume_up", ccw: "volume_down", acceleration: 2 }, { name: "Scroll", cw: "wheel:down", ccw: "wheel:up" }], layer: { buttons: { "0": "win+e" }, dial: [] } },
        { name: "Browser", apps: ["chrome", "msedge"], buttons: { "0": { tap: "alt+left", menu: "apps" } }, dial: [{ name: "Scroll", cw: "wheel:down", ccw: "wheel:up", acceleration: 3 }] },
      ] };
  }
  await reload();
  const d = profiles().findIndex(isDefault);
  view = { kind: "profile", index: d >= 0 ? d : 0 };
  render();
})();
